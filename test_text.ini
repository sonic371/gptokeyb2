[config]
repeat_delay = 500
repeat_rate = 60

mouse_scale = 3000
mouse_delay = 16
mouse_slow_scale = 30

deadzone_mode = axial
deadzone = 5000
deadzone_scale = 10
deadzone_delay = 16

mouse_wheel_amount = 3

[controls]
overlay = clear

# Mouse navigation with left analog
left_analog = mouse_movement

# Scroll with right analog (inverted — like touchpad natural scrolling)
right_analog_up = mouse_wheel_down repeat
right_analog_down = mouse_wheel_up repeat

# Click buttons
a = mouse_left
b = mouse_right
x = mouse_middle

# DPad as arrow keys
up = up
down = down
left = left
right = right

# Hold L2 for text input
l2 = hold_state text_input
# Hold R1 for slow mouse
r1 = mouse_slow

back = esc
start = enter
guide = tab

[controls:text_input]
overlay = clear

charset = extended

up = prev_letter
down = next_letter
right = add_letter
left = backspace
a = add_letter
b = backspace
start = finish_text
back = cancel_text

l1 = prev_letter10
r1 = next_letter10
y = toggle_case
