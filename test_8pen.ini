[config]
repeat_delay = 200
repeat_rate = 35
mouse_scale = 3000
mouse_delay = 16
mouse_slow_scale = 30
deadzone_mode = exp
deadzone = 0
deadzone_x = 0
deadzone_y = 0
deadzone_scale = 10
mouse_accel_power = 200
deadzone_delay = 16
mouse_wheel_amount = 3

[controls]
overlay = clear

# Mouse navigation with left analog
left_analog = mouse_movement

# Scroll with right analog — adaptive acceleration (harder push = faster scroll)
scroll_accel_power = 250

# Click buttons
a = mouse_left
b = mouse_right
x = mouse_middle

# DPad as arrow keys
up = up
down = down
left = left
right = right

# Hold L2 for text input
l2 = hold_state text_input
r1 = mouse_slow

back = esc
start = enter
guide = tab

[controls:text_input]
overlay = clear

charset = "8pen"

# LEFT ANALOG STICK — continuous gesture like 8pen on Android.
#
# First two directions = combo to pick a letter group:
#   →↓  = group 0 = NMF!      →↑  = group 1 = ARX?
#   ↑→  = group 2 = YBPQ      ↑←  = group 3 = SDG'
#   ←↑  = group 4 = TCZ.      ←↓  = group 5 = IHJ,
#   ↓←  = group 6 = ELK@      ↓→  = group 7 = OUVW
#
# After the combo, move the stick to another direction to pick the slot:
#   RIGHT = slot 0, UP = slot 1, LEFT = slot 2, DOWN = slot 3
#
# In group NMF! (→↓):  stop = n   → RIGHT  = n   → UP  = m   → LEFT  = f   → DOWN = !
# In group ARX? (→↑):  stop = a   → RIGHT  = a   → UP  = r   → LEFT  = x   → DOWN = ?
# In group YBPQ (↑→):  stop = y   → RIGHT  = y   → UP  = b   → LEFT  = p   → DOWN = q
#
# Release the stick (return to center) to commit the character.
#
# It's one continuous motion — like a fighting game special move.

# D-Pad for cursor navigation while typing
up = home
down = end
left = left
right = right

r2 = dir_space
l1 = backspace
guide = enter
start = finish_text
back = cancel_text


